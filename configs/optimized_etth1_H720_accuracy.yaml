project:
  name: HADT_NQ
  version: '1.1'
data:
  root_path: ./dataset
  time_column: date
  feature_mode: M
  seq_len: 336
  split_ratios:
    ETT:
    - 0.6
    - 0.2
    - 0.2
    other:
    - 0.7
    - 0.1
    - 0.2
  datasets:
  - ETTh1
  files:
    ETTh1: ETT-small/ETTh1.csv
    ETTh2: ETT-small/ETTh2.csv
    ETTm1: ETT-small/ETTm1.csv
    ETTm2: ETT-small/ETTm2.csv
    Electricity: electricity/electricity.csv
    Traffic: traffic/traffic.csv
    Weather: weather/weather.csv
model:
  name: hadt_detail
  variant: local_fine
  output_mode: quantile
  quantiles:
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 0.9
  - 0.95
  params:
    d_ff: 128
    grid_power: 1.0
    d_model: 64
    skip_dropout: 0.0
    patch_len: 8
    local_kernel: 3
    dropout: 0.2
    median_skip: none
    e_layers: 2
    encoder_kind: local
    max_offset: 1.5
    n_points: 8
    stride: 4
    n_heads: 8
    max_horizon: 720
    horizon_chunk_size: 96
    gradient_checkpointing: false
    min_quantile_gap: 0.0001
training:
  batch_size: 32
  channel_sample_size: 16
  epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.001
  early_stopping_patience: 7
  gradient_clip: 1.0
  amp: false
  scheduler_factor: 0.5
  scheduler_patience: 2
  min_learning_rate: 1.0e-06
  channel_policy: full
  difference_weight: 0.0
evaluation:
  batch_size: 32
  channel_chunk_size: 8
  save_horizon_metrics: true
  channel_policy: full
experiment:
  horizons:
  - 720
  seeds:
  - 2024
  - 2025
  - 2026
  output_dir: ./outputs
  run_name: optimized_etth1_H720_accuracy
  scope: optimized_etth1
runtime:
  device: cuda:0
  num_workers: 0
  pin_memory: true
  torch_threads: 3
visualization:
  enabled: true
  max_channels: 7
optimization:
  selection_source: outputs/etth1_detail_search/horizon_selection.json
  candidate:
    encoder_kind: local
    d_model: 64
    d_ff: 128
    e_layers: 2
    patch_len: 8
    stride: 4
    dropout: 0.2
    n_points: 8
    max_offset: 1.5
    grid_power: 1.0
    median_skip: none
    skip_dropout: 0.0
    local_kernel: 3
    learning_rate: 0.0003
    weight_decay: 0.001
    difference_weight: 0.0
    id: local_fine
  test_used_for_selection: false
